    type: SQL Query
    sql-query: |
      select the_user,
          '<div class="hour-graph">'||
              '<span class="hour'|| case when h00 = 0 then ' is-null' when h00 > 999 then ' is-over1k' end ||'"><span class="hour-label"> 0</span> <span class="hour-value">'|| 
