help: 
  help-text: |
    <p>Utilisez cet état et ce graphique pour afficher les utilisateurs comportant le plus de vues de page pour la tanche de temps spécifiée.</p>
    <p>Sélectionnez la tranche de temps de génération d'état (par défaut = 1 jour) et choisissez l'icône d'état ou de graphique en haut de la page.</p>
    <p>Pour l'état interactif, utilisez le champ de recherche ou sélectionnez l'en-tête de colonne <strong>Utilisateur</strong> pour sélectionner un utilisateur spécifique. Vous pouvez exécuter de nombreuses fonctions en cliquant sur le bouton <strong>Actions</strong>, telles que les colonnes affichées/masquées, les lignes par page, les filtres, etc. Pour rétablir les paramètres par défaut de l'état interactif, cliquez sur le bouton <strong>Réinitialiser</strong>.</p>

