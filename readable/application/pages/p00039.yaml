- # ====== Region: Dossiers En Attente =========================
  id: 7244909208868232
  identification: 
    name: Dossiers En Attente
    type: Cartes

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT
          cc.id,
          cc.ref_ao,
          cc.objet_cct,
          cc.budget,
          cc."DÉTAIL_DE_RÉPONSE",
          cc.nature_de_depense,
          cc."DATE_LIMITE_PROPOSÉE",
          cc.date_de_lanc,
          cc.pv_cct,
          cc.programme_ouverture_de_plis,
          cc.jours_rest,
          cc.date_ouverture_des_plis,
          cc.status,
          cc.creer_par,
          cc."DATE_CRÉATION",
          cc.programme_de_lancement
      FROM cc
      WHERE cc.status = 5
      
        AND NOT EXISTS (
              SELECT 1
              FROM contrats ct
              WHERE ct.id_cc = cc.id
        );
      

  order-by: 
    type: None

  layout: 
    sequence: 30
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
