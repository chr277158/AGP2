- # ====== Page Item: P10040_ALLOW_OTHER_USERS =================
  id: 74585294246474929585
  identification: 
    name: P10040_ALLOW_OTHER_USERS
    type: Changer

  label: 
    label: Tous les utilisateurs authentifiés peuvent accéder à cette application
    alignment: Left

  settings: 
    utiliser-les-valeurs-par-défaut: true

  layout: 
    sequence: 30
    region: Configuration du contrôle d'accès # 74585290943554929583
    slot: BODY
    alignment: Left
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic
    label-column-span: 3

  appearance: 
    template: Optional
    template-options: 
    - '#DEFAULT#'

  validation: 
    value-required: true

  advanced: 
    warn-on-unsaved-changes: Page Default

  source: 
    type: Function Body
    language: PL/SQL
    pl/sql-function-body: |
      if apex_app_setting.get_value( p_name => 'ACCESS_CONTROL_SCOPE' ) = 'ACL_ONLY' then
          return 'N';
      else
          return 'Y';
      end if;
    used: Only when current value in session state is null

  session-state: 
    storage: Per Session (Persistent)

  security: 
    session-state-protection: Unrestricted
    store-value-encrypted-in-session-state: true
    restricted-characters: All characters can be saved.

  help: 
    inline-help-text: Sélectionnez <strong>Non</strong> si tous les utilisateurs sont définis dans la liste de contrôle d'accès. Sélectionnez <strong>Oui</strong> si les utilisateurs authentifiés ne figurant pas dans la liste de contrôle d'accès peuvent également utiliser cette application.

