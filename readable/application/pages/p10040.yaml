processes: 
- # ====== Process: Définir le contrôle d'accès ================
  id: 74585294634044929586
  identification: 
    name: Définir le contrôle d'accès
    type: Exécuter le code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
          if :P10040_ALLOW_OTHER_USERS = 'Y' then
              apex_app_setting.set_value (
                  p_name  => 'ACCESS_CONTROL_SCOPE',
                  p_value => 'ALL_USERS');
          else
              apex_app_setting.set_value (
                  p_name  => 'ACCESS_CONTROL_SCOPE',
                  p_value => 'ACL_ONLY');
          end if;
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  success-message: 
    success-message: Paramètres de contrôle d'accès enregistrés.

  error: 
    display-location: Inline in Notification

