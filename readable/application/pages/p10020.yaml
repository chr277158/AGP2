- # ====== Page Item: P10020_DESKTOP_THEME_STYLE_ID ============
  id: 74585207434421929410
  identification: 
    name: P10020_DESKTOP_THEME_STYLE_ID
    type: Liste SELECT

  label: 
    label: Style de thème du bureau
    alignment: Left

  settings: 
    action-de-page-lors-de-la-sélection: Aucun

  multiple-values: 
    type: No

  layout: 
    sequence: 10
    region: Configurer l'apparence # 74585204373628929408
    slot: BODY
    alignment: Left
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic
    label-column-span: 3

  appearance: 
    template: Optional - Floating
    template-options: 
    - '#DEFAULT#'
    height: 1

  validation: 
    value-required: true

  list-of-values: 
    type: Shared Component
    list-of-values: DESKTOP THEME STYLES # 74585207532348929410
    display-extra-values: false
    display-null-value: false

  advanced: 
    warn-on-unsaved-changes: Page Default

  source: 
    type: SQL Query (return single value)
    sql-query: |
      select s.theme_style_id
      from apex_application_theme_styles s,
          apex_application_themes t
      where s.application_id = t.application_id
          and s.theme_number = t.theme_number
          and s.application_id = :app_id
          and t.ui_type_name   = 'DESKTOP'
          and s.is_current = 'Yes'
    used: Always, replacing any existing value in session state

  session-state: 
    storage: Per Session (Persistent)

  quick-picks: 
    show-quick-picks: false

  server-side-condition: 
    type: Rows returned
    sql-query: |
      select null
        from apex_application_theme_styles s,
             apex_application_themes t
       where s.application_id = t.application_id
         and s.theme_number   = t.theme_number
         and s.application_id = :app_id
         and t.ui_type_name   = 'DESKTOP'

  security: 
    session-state-protection: Unrestricted
    store-value-encrypted-in-session-state: true
    restricted-characters: Blocklist HTML command characters (<>")

  help: 
    inline-help-text: Le style de thème par défaut s'applique à tous les utilisateurs.

