- # ====== Dynamic Action: Nouveau =============================
  id: 6709749725625569
  identification: 
    name: Nouveau

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P45_NB_CONTRAT

  actions: 
  - # ====== Action: Exécuter le code JavaScript =================
    id: 6709857090625570
    identification: 
      action: Exécuter le code JavaScript

    settings: 
      code: |
        var nb = $v("P45_NB_CONTRAT"); 
        var igRegion = apex.region("contrats_ig"); // ID statique de ta région IG 
        var igWidget = igRegion.widget(); var igActions = igWidget.interactiveGrid("getActions");
        
        
        for (var i = 0; i < nb; i++) {
           igActions.invoke("row-add-row");  // ✅ action correcte
        }
        

    execution: 
      sequence: 10
      event: Nouveau # 6709749725625569
      fire-when-event-result-is: True
      fire-on-initialization: false

