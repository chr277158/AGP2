    - '#DEFAULT#'
    height: 1

  validation: 
    value-required: false

  list-of-values: 
    type: SQL Query
    sql-query: |
      SELECT TO_CHAR(ADD_MONTHS(TRUNC(SYSDATE, 'MM'), -LEVEL + 2), 'MM/YYYY') AS display_value,
             TO_CHAR(ADD_MONTHS(TRUNC(SYSDATE, 'MM'), -LEVEL + 2), 'MM/YYYY') AS return_value
      FROM DUAL
      CONNECT BY LEVEL <= 24
      ORDER BY TO_DATE(return_value, 'MM/YYYY') DESC;
    display-extra-values: true
    display-null-value: true

  advanced: 
    warn-on-unsaved-changes: Page Default

