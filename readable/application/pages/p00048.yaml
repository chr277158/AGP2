  source: 
    html-code: |2
          <style>
              body {
                  font-family: 'Times New Roman';
                  font-size: 12pt
              }
      @media print { .ig-toolbar, .t-Body-nav, .t-Header { display:none !important; }
                       .a4 { border:3px double #000; } } 
              p {
                  margin: 0pt
              }
      
              table {
                  margin-top: 0pt;
                  margin-bottom: 0pt
              }
      
              @media (max-width: 900px) {
                  img {
                      max-width: 100%;
                      height: auto;
                  }
      
                  .table-container {
                      overflow-x: auto;
                      -webkit-overflow-scrolling: touch;
                  }
      
                  table {
                      width: 100%;
                      border-collapse: collapse;
                  }
      
                  td,
                  th {
                      padding: 8px;
                      text-align: left;
                      border: 1px solid #ddd;
                  }
              }
          </style>
          <script>
      function printDiv(divId) {
      
          var content = document.getElementById(divId);
      
          if (!content) {
              alert("Div introuvable");
              return;
          }
      
          var printWindow = window.open('', '_blank');
      
          printWindow.document.open();
      
          printWindow.document.write(`
              <html>
              <head>
                  <title>Impression</title>
      
                  <style>
      
                      @page{
                          size:A4 portrait;
                          margin:10mm;
                      }
      
                      body{
                          font-family:"Times New Roman", serif;
                          direction:rtl;
                          margin:0;
                          padding:0;
                      }
      
                      #print-content{
                          width:100%;
                      }
      
                      table{
                      height:400pt;
                    
                          width:100%;
                          border-collapse:collapse;
                      }
      
                      td, th{
                          border:1px solid #000;
                          padding:4px;
                          text-align:center;
                          vertical-align:middle;
                      }
      
                      .print-btn{
                          display:none !important;
                      }
      
                  </style>
              </head>
      
              <body>
      
                  <div id="print-content">
                      ${content.innerHTML}
                  </div>
      
              </body>
              </html>
          `);
      
          printWindow.document.close();
      
          // attendre chargement complet
          printWindow.onload = function () {
      
              printWindow.focus();
      
              setTimeout(function () {
      
                  printWindow.print();
      
                  printWindow.close();
      
              }, 500);
          };
      }
      </script>
      
      
      
