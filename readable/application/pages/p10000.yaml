---
# ====== Page: Administration ================================
id: 10000
identification: 
  name: Administration
  alias: ADMIN
  title: Administration

appearance: 
  page-mode: Normal
  page-template: Theme Default
  template-options: 
  - '#DEFAULT#'

navigation-menu: 
  override-user-interface-level: false

navigation: 
  cursor-focus: Do not focus cursor
  warn-on-unsaved-changes: true

javascript: 
  function-and-global-variable-declaration: |
    function refreshconnected() {
        try {
            var reg = apex.region('connected');
            if (reg) {
                reg.refresh();
                // بعد أن ينتهي الـ refresh نطبّق النسبة على البادجات
                setTimeout(applyProgressWidth, 500);
            }
        } catch (e) {
            console.error('Refresh error:', e);
        }
    }

security: 
  authorization-scheme: Droits de lecteur # 74585100429726929216
  authentication: Page Requires Authentication
  deep-linking: Disabled
  page-access-protection: Arguments Must Have Checksum
  form-auto-complete: Off
  browser-cache: Application Default

session-management: 
  rejoin-sessions: Application Default

advanced: 
  enable-duplicate-page-submissions: Yes - Enable page to be re-posted
  reload-on-submit: Only for Success

server-cache: 
  caching: Disabled

help: 
  help-text: |
    <p>La page d'administration permet aux propriétaires de l'application (administrateurs) de configurer l'application et de tenir à jour les données communes qu'elle utilise.
    En sélectionnant l'un des paramètres disponibles, les administrateurs peuvent potentiellement modifier l'affichage de l'application et/ou les fonctions disponibles pour les utilisateurs finals.</p>
    <p>L'accès à cette page doit être exclusivement limité aux administrateurs.</p>

regions: 
- # ====== Region: connected ===================================
  id: 3512067597676044
  identification: 
    name: connected
    type: Comments

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT COUNT(*) AS nb_utilisateurs
      FROM APEX_WORKSPACE_SESSIONS s
      WHERE s.WORKSPACE_ID = V('WORKSPACE_ID')
        AND s.REMOTE_ADDR <> '0:0:0:0:0:0:0:1' and s.USER_NAME <> 'nobody'
       

  order-by: 
    type: None

  layout: 
    sequence: 13
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: 1
    new-column: true
    column-span: 1

  appearance: 
    template: Blank with Attributes (No Grid)
