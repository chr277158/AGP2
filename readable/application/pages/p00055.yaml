- # ====== Dynamic Action: Nouveau_2 ===========================
  id: 20525248558460748
  identification: 
    name: Nouveau_2

  execution: 
    sequence: 30
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: DOWNLOAD_DOCX # 20517154298460745

  actions: 
  - # ====== Action: Exécuter le code JavaScript =================
    id: 20525696891460750
    identification: 
      action: Exécuter le code JavaScript

    settings: 
      code: |
        // Récupérer le contenu HTML de la région
        var regionBody = document.getElementById('ouverture').querySelector('.t-Region-body') || document.getElementById('ouverture');
        var htmlContent = regionBody.innerHTML;
        
        // Construction d'un gabarit HTML strict "Office Open XML Landscape"
        var fullHtml = `
        <!DOCTYPE html>
        <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
        <head>
        <meta charset="utf-8">
        <style>
          @page Section1 {
            size: 841.9pt 595.3pt; /* Taille A4 Paysage exacte en points Word */
            margin: .1in .1in .1in .1in;
            mso-header-margin: .1in;
            mso-footer-margin: .1in;
            mso-paper-source: 0;
          }
          div.Section1 { page: Section1; }
          
          body { 
            font-family: "Arial", sans-serif; 
            font-size: 11pt; 
            line-height: 1; 
          }
         
        </style>
        </head>
        <body>
          <div class="Section1">
            ${htmlContent}
          </div>
        </body>
        </html>
        `;
        
        // Convertir et sauvegarder le fichier
        var converted = htmlDocx.asBlob(fullHtml);
        saveAs(converted, 'Programme_Ouverture_Offres.docx');

    execution: 
      sequence: 10
      event: Nouveau_2 # 20525248558460748
      fire-when-event-result-is: True
      fire-on-initialization: false

