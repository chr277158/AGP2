processes: 
- # ====== Process: Login ======================================
  id: 75163333711475297475
  identification: 
    name: Login
    type: Exécuter le code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      apex_authentication.login(
          p_username => :P10071_USERNAME,
          p_password => :P10071_PASSWORD );

  execution: 
    sequence: 20
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

- # ====== Process: Définir le cookie de nom utilisateur =======
  id: 75163334111005297475
  identification: 
    name: Définir le cookie de nom utilisateur
    type: Exécuter le code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      apex_authentication.send_login_username_cookie (
          p_username => lower(:P10071_USERNAME),
          p_consent  => :P10071_REMEMBER = 'Y' );

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

- # ====== Process: Obtenir le cookie de nom utilisateur =======
  id: 75163334573872297475
  identification: 
    name: Obtenir le cookie de nom utilisateur
    type: Exécuter le code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      :P10071_USERNAME := apex_authentication.get_login_username_cookie;
      :P10071_REMEMBER := case when :P10071_USERNAME is not null then 'Y' end;

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

