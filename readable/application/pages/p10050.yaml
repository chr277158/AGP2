validations: 
- # ====== Validation: Au moins une information en retour doit ê
  id: 74585333909616929624
  identification: 
    name: Au moins une information en retour doit être indiquée

  execution: 
    sequence: 10

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      if :P10050_FEEDBACK is null and :P10050_RATING is null then
          return false;
      else
          return true;
      end if;
    always-execute: false

  error: 
    error-message: Fournissez des informations en retour sur votre expérience.
    display-location: Inline in Notification

processes: 
- # ====== Process: Soumettre les informations en retour =======
  id: 74585333518991929623
  identification: 
    name: Soumettre les informations en retour
    type: Exécuter le code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      begin
      apex_util.submit_feedback (
          p_comment              => :P10050_FEEDBACK,
          p_application_id       => :APP_ID,
          p_page_id              => :P10050_PAGE_ID,
          p_rating               => :P10050_RATING
          );
      end;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  success-message: 
    success-message: Informations en retour soumises

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: SUBMIT # 74585325691761929619

branches: 
- # ====== Branch: Aller à la page 10051 =======================
  id: 74585334320450929624
  identification: 
    name: Aller à la page 10051

  execution: 
    sequence: 10
    point: After Processing

