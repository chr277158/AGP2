dynamic-actions: 
- # ====== Dynamic Action: attribut couleur ====================
  id: 70510729425941647011
  identification: 
    name: attribut couleur

  execution: 
    sequence: 10
    event-scope: Dynamic

  when: 
    event: Page Load

  actions: 
  - # ====== Action: Exécuter le code JavaScript =================
    id: 70510729499698647012
    identification: 
      action: Exécuter le code JavaScript

    settings: 
      code: |
        $('td[headers="APPROBATION"]').each(function() {  
          if ( $(this).text() === 'Y' ) {
            $(this).closest('tr').find('td').css({"background-color":"rgb(37 90 185 / 90%)"});
              $(this).closest('tr').find('td').css({"color":"black"});
              $(this).closest('tr').find('td').css({"font-weight":"bold"});
              $(this).closest('tr').find('td').css({"border":"1px solid #D6EAF8  !important"});
          }
           if ( $(this).text() === 'N' ) {
            $(this).closest('tr').find('td').css({"background-color":"#4FA64F "});
              $(this).closest('tr').find('td').css({"color":"black"});
               $(this).closest('tr').find('td').css({"font-weight":"bold"});
              $(this).closest('tr').find('td').css({"border":"1px solid #D6EAF8  !important"});
          }
          
        });
        
        

    affected-elements: 
      selection-type: Item(s)
      item(s): 
      - '&APPROBATION'

    execution: 
      sequence: 10
      event: attribut couleur # 70510729425941647011
      fire-when-event-result-is: True
      fire-on-initialization: false

