    new-column: true
    column-span: Automatic

  appearance: 
    template: Blank with Attributes
    template-options: 
    - '#DEFAULT#'
    - t-Region--hideHeader js-addHiddenHeadingRoleDesc
    - t-Region--hiddenOverflow
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  server-side-condition: 
    type: Item = Value
    item: P22_VIEW_AS
    value: CHART

  security: 
    escape-special-characters: true

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    id: 7707274050389571
    chart: 
      type: Donut

    layout: 
      height: 600

    data-cursor: 
      cursor: Automatic
      behavior: Automatic
      dim-on-hover: true

    settings: 
      pie-selection-effect: Highlight

    value: 
      pie-chart-other-threshold: 0.02
      format: Decimal
      decimal-places: 0
      format-scaling: Automatic

    animation: 
      on-display: None
      on-data-change: Automatic

    tooltip: 
      show: true
      show-series-name: true
      show-value: true

    legend: 
      show: false

    advanced: 
      initialization-javascript-function: |
        function( options ){ 
        
            this.pieSliceLabel = function(dataContext) {
                var series_name,
                    percent = Math.round(dataContext.value/dataContext.totalValue*100);
                
                if ( dataContext.seriesData ) {
                    series_name = dataContext.seriesData.name;
                } else {
                    series_name = 'Other';
                }
                return series_name + " " + percent + "% ( " + dataContext.value + " )";
            }
            
            // Set chart initialization options 
            options.dataLabel = pieSliceLabel; 
            return options; 
        }

    series: 
    - # ====== Series: Série 1 =====================================
      id: 7707808538389575
      identification: 
        name: Série 1

      execution: 
        sequence: 10

      source: 
        location: Local Database
        type: SQL Query
        sql-query: |
          select userid_lc as userid,
                 count(*) as page_views
            from apex_activity_log
           where flow_id     = :app_id
             and time_stamp >= sysdate - ( 1/24/60/60 * :P22_TIMEFRAME )
             and userid     is not null
           group by userid_lc
           order by 2
        page-items-to-submit: 
        - P22_TIMEFRAME

      order-by: 
        type: None

      column-mapping: 
        label: USERID
        value: PAGE_VIEWS

      label: 
        show: true
        position: Outside Slice
        display-as: Label

- # ====== Region: Informations sur la liste de contrôle d'accès
  id: 74609831422939719178
  identification: 
    name: Informations sur la liste de contrôle d'accès
    type: Contenu dynamique PL/SQL [Hérité]

  source: 
    pl/sql-code: |
      declare
          l_acl_scope varchar2(45);
      begin
          l_acl_scope := apex_app_setting.get_value( p_name => 'ACCESS_CONTROL_SCOPE' );
      
          if l_acl_scope = 'ALL_USERS' then
              sys.htp.p( apex_lang.message('APEX.FEATURE.ACL.INFO.ALL_USERS') );
          elsif l_acl_scope = 'ACL_ONLY' then
              sys.htp.p( apex_lang.message('APEX.FEATURE.ACL.INFO.ACL_ONLY') );
          else
              sys.htp.p( apex_lang.message('APEX.FEATURE.ACL.INFO.ACL_VALUE_INVALID', l_acl_scope) );
          end if;
      end;

  layout: 
    sequence: 23
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Alert
    template-options: 
    - '#DEFAULT#'
    - t-Alert--colorBG
    - t-Alert--horizontal
    - t-Alert--noIcon
    - t-Alert--warning
    - t-Alert--accessibleHeading
    css-classes: 
    - margin-sm
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  server-cache: 
    caching: Disabled

  customization: 
    customizable: Not Customizable By End Users

- # ====== Region: Etat sur le nombre d'utilisateurs ===========
  id: 74609832091200721015
  identification: 
    name: Etat sur le nombre d'utilisateurs
    type: Etat classique

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select r.role_name, (select count(*) from apex_appl_acl_user_roles ur where r.role_id = ur.role_id) user_count, r.role_id
      from apex_appl_acl_roles r
      where r.application_id = :APP_ID
      group by r.role_name, r.role_id
      order by 2 desc, 1

