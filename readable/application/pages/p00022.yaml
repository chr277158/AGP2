- # ====== Region: Graphique des principaux utilisateurs =======
  id: 74609742347060921513
  identification: 
    name: Graphique des principaux utilisateurs
    type: Graphique

  source: 
    location: None

  layout: 
    sequence: 83
    parent-region: Nouveau # 7667080672147146
    slot: BODY
    start-new-layout: false
    start-new-row: true
