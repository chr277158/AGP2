- # ====== Region: جدول الاشغال ================================
  id: 4146125082107390
  identification: 
    name: جدول الاشغال
    type: Grille interactive

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT s.ID,
             s."الكلفة_التقديرية",
             s."نوعية_الطلب",
             s."اللجنة_المختصة",
             s."الاجراءات",
             s."طريقة_ابرام_الصفقة",
             s."آجال_الانجاز",
             s."المكلف_بالملف",
             s."رقم_الاستشارة",
             s."تاريخ_بداية_معالجة_الملف_الجديد",
             CASE 
               WHEN c.REF_AO IS NOT NULL  THEN 'OK'
               WHEN  c.REF_AO IS  NULL  AND s."تاريخ_بداية_معالجة_الملف_الجديد" < SYSDATE THEN 'WAIT'
              
               ELSE 'KO'
             END AS ETAT,
             s."التاريخ_نهاية_العقد_الجاري",
             s."موضوع_الصفقة",
             s.ANNEE
      FROM SUIVI s
      LEFT JOIN CC c
             ON c.REF_AO = s."رقم_الاستشارة"
          WHERE s.ANNEE = :P34_ANNEE   ;
      

  layout: 
    sequence: 20
    parent-region: No Parent
    slot: BODY
