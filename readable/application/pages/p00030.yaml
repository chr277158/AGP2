  - # ====== Column: DEVISE ======================================
    id: 7347155116823563
    identification: 
      column-name: DEVISE
      type: Liste de valeurs (LOV) instantanée

    heading: 
      heading: Devise
      alignment: end

    settings: 
      afficher-en-tant-que: Fenêtre instantanée incorporée
      extraction-initiale: Automatique
      entrée-manuelle: false
      extraire-lors-de-la-recherche: false

    rechercher: 
      type-de-correspondance: Contient
      respect-des-minuscules/majuscules: false
      nombre-minimal-de-caractères: 0

    multiple-values: 
      type: No

    layout: 
      sequence: 110
      column-alignment: end
      stretch: Use Report Setting

    accessibility: 
      value-identifies-row: false

    validation: 
      value-required: false
      maximum-length: 4000

    list-of-values: 
      type: SQL Query
      sql-query: |
        SELECT 
            CASE code
                WHEN 'USD' THEN '💵 Dollar (USD)'
                WHEN 'EUR' THEN '💶 Euro (EUR)'
                WHEN 'TND' THEN '🇹🇳 Dinar (TND)'
                ELSE '💰 Autre'
            END as display_value,
            code as return_value
        FROM (
            SELECT 'USD' as code FROM dual UNION ALL
            SELECT 'EUR' FROM dual UNION ALL
            SELECT 'TND' FROM dual UNION ALL
            SELECT 'OTHER' FROM dual
        )
      display-extra-values: true
      display-null-value: true

    source: 
      type: Database Column
      database-column: DEVISE
      data-type: VARCHAR2
      query-only: false
      primary-key: false

