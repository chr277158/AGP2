- # ====== Dynamic Action: date lancement statut ===============
  id: 4470217458676155
  identification: 
    name: date lancement statut

  execution: 
    sequence: 280
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P4_DATE_OUVERTURE_DES_PLIS

  actions: 
  - # ====== Action: Exécuter le code côté serveur ===============
    id: 4470345256676156
    identification: 
      action: Exécuter le code côté serveur

    settings: 
      langue: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      code-pl/sql: |2
         
        
          -- Règle 2 : DATE_OUVERTURE_DES_PLIS  
          IF :P4_DATE_OUVERTURE_DES_PLIS IS NOT NULL 
             AND TO_DATE(:P4_DATE_OUVERTURE_DES_PLIS, 'DD-MM-YYYY') < SYSDATE
             AND :P4_STATUS < 3
          THEN
            :P4_STATUS := 3;
          END IF;
        

    execution: 
      sequence: 10
      event: date lancement statut # 4470217458676155
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

