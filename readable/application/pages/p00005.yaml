- # ====== Page Item: P5_NB ====================================
  id: 16706019376812639
  identification: 
    name: P5_NB
    type: Masqué

  settings: 
    valeur-protégée: true

  layout: 
    sequence: 10
    region: notification O.P # 31047197907935039
    slot: BODY

  advanced: 
    warn-on-unsaved-changes: Page Default

  source: 
    type: SQL Query (return single value)
    sql-query: |
      SELECT
          COUNT(*) AS NOMBRE_DE_LIGNES
      FROM
          SP SP,
          CC CC
      WHERE
          (SP.ID = CC.ID)
          AND (TRUNC(CC.DATE_OUVERTURE_DES_PLIS) BETWEEN TRUNC(SYSDATE) AND TRUNC(SYSDATE) + 7)
    used: Only when current value in session state is null

  session-state: 
    data-type: VARCHAR2
    storage: Per Session (Persistent)

  security: 
    session-state-protection: Unrestricted
    store-value-encrypted-in-session-state: true
    restricted-characters: All characters can be saved.

