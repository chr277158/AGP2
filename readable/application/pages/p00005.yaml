- # ====== Region: Calendrier ==================================
  id: 74585161852000929355
  identification: 
    name: Calendrier
    type: Calendrier

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select ID,
             ID_CC,
             "Titre",
             case WHEN FMD.ID_CC <> 0 THEN "Titre" || '  ' || CRA || CRA2 END AS TITRE2 ,
             PROPOSITION_COMMISSION,
             PC,
             DATE_PROPOSITION,
             CC_POUR_LANCEMENT,
             CC,
             DATE_CC,
             CRITERES_EVALUATION,
             CE,
             DATE_CRITERES,
             AVIS_DE_PRESSE,
             AP,
             DATE_AVIS,
             DESIGNATION_DE_LA_COMMISSION,
             DC,
             DATE_DESIGNATION,
             PROGRAM_LANC,
             PL,
             DATE_PROGRAM_LANC,
             MAIL_PRESTATAIRE,
             MP,
             DATE_MAIL,
             PROGRAMME_OUVERTURE_DE_PLIS,
             POP,
             DATE_PROGRAM_OUVERTURE,
             NOTE_OUVERTURE_PLIS,
             NOP,
             DATE_NOTE_OP,
             CAUTION_P,
             STATUS,
             ST,
             STAT,
             DATE_DE_LANC,
             TEX,
             DATE_OUVERTURE_DES_PLIS,
             IDS,
             CRA,
             CRA2,
             JOURS,
             PROGRESS_COLOR,
             BODY_HTML,
             "linkh",
             CP,
             "المكلف_بالملف"
       
      FROM FICHIER_MANQUANT_PAR_DOSSIER FMD

  layout: 
    sequence: 20
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Blank with Attributes
    template-options: 
    - '#DEFAULT#'
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  security: 
    escape-special-characters: true

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    settings: 
      colonne-d'affichage: TITRE2
      colonne-de-date-de-début: DATE_OUVERTURE_DES_PLIS
      tri-des-événements: Automatique
      afficher-l'heure: true
      format-horaire: Valeur par défaut
      première-heure: 8
      informations-supplémentaires: ' &CRA. &CRA2. &"المكلف_بالملف".'
      evénements-sur-plusieurs-lignes: true
      afficher-l'info-bulle: true
      navigation-et-vues-de-calendrier: 'month:week:day:list:navigation'
      créer-un-lien: '&"linkh".'
      lien-de-visualisation/modification: 
        url: 'f?p=&APP_ID.:4:&SESSION.::&DEBUG.::P4_ID,P4_ID_1,P4_ID_2:&ID_CC.,&ID_CC.,&ID.'
        page: 4 # Cc
        values: 
          p4_id: '&ID_CC.'
          p4_id_1: '&ID_CC.'
          p4_id_2: '&ID.'

      nombre-maximal-d'événements/jour: 30
      afficher-le-week-end: true

    performance: 
      lazy-loading: false

