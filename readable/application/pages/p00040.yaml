- # ====== Dynamic Action: date lancement statut ===============
  id: 7337250736773515
  identification: 
    name: date lancement statut

  execution: 
    sequence: 310
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P40_DATE_OUVERTURE_DES_PLIS

  actions: 
  - # ====== Action: Exécuter le code côté serveur ===============
    id: 7337746086773515
    identification: 
      action: Exécuter le code côté serveur

    settings: 
      langue: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      code-pl/sql: |2
         
        
          -- Règle 2 : DATE_OUVERTURE_DES_PLIS  
          IF :P40_DATE_OUVERTURE_DES_PLIS IS NOT NULL 
             AND TO_DATE(:P40_DATE_OUVERTURE_DES_PLIS, 'DD-MM-YYYY') < SYSDATE
             AND :P40_STATUS < 3
          THEN
            :P40_STATUS := 3;
          END IF;
        

    execution: 
      sequence: 10
      event: date lancement statut # 7337250736773515
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

