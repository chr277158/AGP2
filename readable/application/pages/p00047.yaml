- # ====== Process: SAVE_CONGE =================================
  id: 18877878772266954
  identification: 
    name: SAVE_CONGE
    type: Exécuter le code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      BEGIN
      
          INSERT INTO T_CONGE (
              MATRICULE,
              NOM_PRENOM,
              SERVICE,
              FONCTION,
              TYPE_CONGE,
              NBR_JOURS,
              NBR_FERIES,
              DATE_DEBUT,
              DATE_FIN,
              SOLDE_AVANT,
              SOLDE_APRES,
              ADRESSE_CONGE,
              TELEPHONE
          )
          VALUES (
              :P47_MATRICULE,
              :P47_NOM_PRENOM,
              :P47_SERVICE,
              :P47_FONCTION,
              :P47_TYPE_CONGE,
              :P47_NBR_JOURS,
              NVL(:P47_NBR_FERIES,0),
              :P47_DATE_DEBUT,
              :P47_DATE_FIN,
              :P47_SOLDE_AVANT,
              :P47_SOLDE_APRES,
              :P47_ADRESSE_CONGE,
              :P47_TELEPHONE
          );
       update SOLDE_CONGE set 
              
              SOLDE= :P47_SOLDE_APRES
      where 
          MATRICULE = :P47_MATRICULE
              
         ;
          COMMIT;
      
          HTP.P('success');
      
      EXCEPTION
          WHEN OTHERS THEN
      
              HTP.P(SQLERRM);
      
      END;

  execution: 
    sequence: 20
    point: Ajax Callback
    run-process: Once Per Page Visit (default)

