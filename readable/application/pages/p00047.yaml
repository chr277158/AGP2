javascript: 
  function-and-global-variable-declaration: |
    function saveAndPrint() {
    
        apex.server.process(
            "SAVE_CONGE",
            {
                pageItems:
                    "#P47_MATRICULE," +
                    "#P47_NOM_PRENOM," +
                    "#P47_SERVICE," +
                    "#P47_FONCTION," +
                    "#P47_TYPE_CONGE," +
                    "#P47_NBR_JOURS," +
                    "#P47_NBR_FERIES," +
                    "#P47_DATE_DEBUT," +
                    "#P47_DATE_FIN," +
                    "#P47_SOLDE_AVANT," +
                    "#P47_SOLDE_APRES," +
                    "#P47_ADRESSE_CONGE," +
                    "#P47_TELEPHONE"
            },
            {
    
                dataType: "text",
    
                success: function(pData) {
    
                    if (pData.trim() === "success") {
    
                        printRegion('formulaire-a4');
    
                    } else {
    
                        alert(pData);
    
                    }
                },
    
                error: function(xhr, status, error) {
    
                    console.log(xhr.responseText);
    
                    alert("Erreur : " + error);
    
                }
            }
        );
    }

