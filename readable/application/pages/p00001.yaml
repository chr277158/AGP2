processes: 
- # ====== Process: Nouveau ====================================
  id: 7556254928892842
  identification: 
    name: Nouveau
    type: Exécuter le code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      BEGIN
         FOR rec IN (
            SELECT cc.id,
                   cc.ref_ao,
                   cc.objet_cct,
                   cc.budget,
                   cc.creer_par
            FROM cc
            WHERE cc.status = 5
              AND NOT EXISTS (
                    SELECT 1 
                    FROM contrats ct 
                    WHERE ct.id_cc = cc.id
              )
              AND EXISTS (
                    SELECT 1
                    FROM sp
                    WHERE sp.id = cc.id
                      AND sp."تاريخ_قرار__لجنة_الصفقات" + 5 < SYSDATE
              )
         ) LOOP
            DECLARE
               v_count NUMBER;
            BEGIN
               -- Vérifier si une note existe déjà pour cet AO (peu importe l'user_id)
               SELECT COUNT(*)
               INTO v_count
               FROM user_notes un
               WHERE un.note_title = 'Contrat manquant pour AO ' || rec.ref_ao;
      
               IF v_count = 0 THEN
                  -- Insertion pour le premier utilisateur
                  INSERT INTO user_notes (
                     user_id,
                     note_title,
                     note_details,
                     reminder_datetime,
                     importance_level
                  ) VALUES (
                     'CONTRIBUTOR',
                     'Contrat manquant pour AO ' || rec.ref_ao,
                     'Objet: ' || rec.objet_cct || ', Budget: ' || rec.budget,
                     SYSDATE,
                     3
                  );
      
                  -- Insertion pour le deuxième utilisateur
                  INSERT INTO user_notes (
                     user_id,
                     note_title,
                     note_details,
                     reminder_datetime,
                     importance_level
                  ) VALUES (
                     'ADMINISTRATOR',
                     'Contrat manquant pour AO ' || rec.ref_ao,
                     'Objet: ' || rec.objet_cct || ', Budget: ' || rec.budget,
                     SYSDATE,
                     3
                  );
               END IF;
            END;
         END LOOP;
      END;
      

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

- # ====== Process: MARK_REMINDER_SENT =========================
  id: 7575255417516884
  identification: 
    name: MARK_REMINDER_SENT
    type: Exécuter le code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      DECLARE
          l_reminder_id NUMBER := APEX_APPLICATION.G_X01;
      BEGIN
          UPDATE user_notes 
          SET is_sent = 'Y',
              last_updated = SYSDATE
          WHERE id = l_reminder_id 
          AND user_id = :P0_MAT;
          
          IF SQL%ROWCOUNT > 0 THEN
              apex_json.open_object;
              apex_json.write('status', 'success');
              apex_json.write('message', 'تم تحديث حالة التنبيه');
              apex_json.close_object;
          ELSE
              apex_json.open_object;
              apex_json.write('status', 'error');
              apex_json.write('message', 'لم يتم العثور على التنبيه');
              apex_json.close_object;
          END IF;
      END;
      

  execution: 
    sequence: 20
    point: Ajax Callback
    run-process: Once Per Page Visit (default)

- # ====== Process: GET_PENDING_REMINDERS ======================
  id: 7575521693518370
  identification: 
    name: GET_PENDING_REMINDERS
    type: Exécuter le code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      BEGIN
          apex_json.open_object;
          apex_json.open_array('items');
      
          FOR r IN (
              SELECT id, note_title, note_details, importance_level
              FROM user_notes
              WHERE user_id = :APP_USER
              AND reminder_datetime - (NVL(pre_reminder_mins,0)/1440) <= SYSDATE  -- حان وقت التنبيه
              AND reminder_datetime >= SYSDATE - 1/24  -- الموعد لم ينتهِ تماماً (آخر ساعة)
              AND rownum <= 10
          )
          LOOP
              apex_json.open_object;
              apex_json.write('ID', r.id);
              apex_json.write('NOTE_TITLE', r.note_title);
              apex_json.write('NOTE_DETAILS', r.note_details);
              apex_json.write('IMPORTANCE_LEVEL', r.importance_level);
              apex_json.close_object;
          END LOOP;
      
          apex_json.close_array;
          apex_json.close_object;
      END;
      

  execution: 
    sequence: 30
    point: Ajax Callback
    run-process: Once Per Page Visit (default)

