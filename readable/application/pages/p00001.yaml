- # ====== Region: APPELS D’OFFFRES en Cours ===================
  id: 70547017221478906265
  identification: 
    name: APPELS D’OFFFRES en Cours
    title: '&ID_CC.'
    type: Cartes

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select ID,
             ID_CC,
            
             "Titre",
              OBJET,
             PROPOSITION_COMMISSION,
             PC,
             DATE_PROPOSITION,
             CC_POUR_LANCEMENT,
             CC,
             DATE_CC,
             CRITERES_EVALUATION,
             CE,
             DATE_CRITERES,
             AVIS_DE_PRESSE,
             AP,
             DATE_AVIS,
             DESIGNATION_DE_LA_COMMISSION,
             DC,
             DATE_DESIGNATION,
             PROGRAM_LANC,
             PL,
             DATE_PROGRAM_LANC,
             MAIL_PRESTATAIRE,
             MP,
             DATE_MAIL,
             PROGRAMME_OUVERTURE_DE_PLIS,
             POP,
             DATE_PROGRAM_OUVERTURE,
             NOTE_OUVERTURE_PLIS,
             NOP,
             DATE_NOTE_OP,
             CAUTION_P,
             STATUS,
             ST,
             STAT,
             DATE_DE_LANC,
             TEX,
             DATE_OUVERTURE_DES_PLIS,
             IDS,
             CRA,
             CRA2,
             JOURS,
             PROGRESS_COLOR,
             BODY_HTML,
             "linkh",
             CP,
             "المكلف_بالملف"
       
      FROM FICHIER_MANQUANT_PAR_DOSSIER
      WHERE (
          -- Cas 1 : Utilisateur standard (ne voit que ses dossiers)
          (UPPER(v('P1_ROLE')) NOT IN ('ADMINISTRATOR', 'CONTRIBUTOR') 
