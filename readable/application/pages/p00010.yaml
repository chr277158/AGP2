css: 
  inline: |2
     /* Styles RTL pour la région arabe */
    #MA_REGION_ARABE .t-Report-report, 
    #MA_REGION_ARABE table {
        direction: rtl;
        text-align: right;
        width: 100% !important;
    }
    
    #MA_REGION_ARABE td, 
    #MA_REGION_ARABE th {
        text-align: right !important;
    }
    
    /* Lignes alternées - SCOPÉ à la région */
    #MA_REGION_ARABE tr:nth-child(even) {
        background-color: #ebe9e9;
    }*
    
    /* Styles d'impression */
    @media print {
        /* --- MASQUER LES BOUTONS --- */
        
        /* 1. Masquer la zone standard des boutons de page */
        .t-ButtonRegion, 
        .t-Region-buttons,
        .t-Dialog-footer {
            display: none !important;
        }
    /* la région de droite : ligne verticale + espace */
      .print-sep-left {
        border-left: 1px solid #999;
        padding-left: 12px;
      }
        /* 2. Masquer la barre de boutons spécifique aux modales jQuery UI (très fréquent) */
        .ui-dialog-buttonpane, 
        .ui-dialog-titlebar {
            display: none !important;
        }
        
        /* 3. Masquer TOUS les boutons de la page (Solution radicale mais sûre pour un rapport) */
        button, 
        input[type="button"], 
        .t-Button {
            display: none !important;
        }
    
        /* --- GESTION DU TITRE ET MISE EN PAGE --- */
        body::before {
            content: attr(data-page-title);
            display: block;
            text-align: center;
            font-size: 24pt;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ccc;
            width: 100%;
        }
    
        /* Réinitialiser le fond et les marges pour éviter les pages blanches */
        body, .t-Dialog-page {
            background-color: white !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: visible !important;
            height: auto !important;
        }
    }
    

