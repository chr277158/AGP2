- # ====== Authorization: Droits de lecteur ====================
  id: 74585100429726929216
  identification: 
    name: Droits de lecteur

  subscription: 
    version-number: 1

  authorization-scheme: 
    type: Fonction PL/SQL renvoyant une valeur booléenne

  settings: 
    corps-de-fonction-pl/sql: |
      if nvl(apex_app_setting.get_value(
         p_name => 'ACCESS_CONTROL_SCOPE'),'x') = 'ALL_USERS' then
          -- allow user not in the ACL to access the application
          return true;
      else
          -- require user to have at least one role
          return apex_acl.has_user_any_roles (
              p_application_id => :APP_ID, 
              p_user_name      => :APP_USER);
      end if;

  server-cache: 
    evaluation-point: Once per Session

  error: 
    error-message: Vous n'êtes pas autorisé à afficher cette application, car vous ne disposez pas des droits d'accès ou votre compte a été verrouillé. Contactez l'administrateur de l'application.

